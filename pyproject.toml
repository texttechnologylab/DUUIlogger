[project]
name = "duui-logging"
version = "0.1.0"
description = "LoggingTest library for DUUI Python tool components: emits info/warning/error logs that can be surfaced on the Java side"
readme = "README.md"
authors = [
    { name = "Daniel Bundan", email = "bundan@em.uni-frankfur.de" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "uvicorn[standard]>=0.52.1",
]
